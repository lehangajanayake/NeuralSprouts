experiment:
  name: lettuce_dry_weight_prediction
  version: v1
  description: Baseline CNN model for lettuce dry weight prediction

model:
  name: SimpleCNN
  version: v1
  input_channels: 3
  input_size: 224
  dropout_rate: 0.5

data:
  train_path: data/train
  val_path: data/val
  test_path: data/test
  batch_size: 32
  num_workers: 4

augmentation:
  pipeline: generic
  image_size: 224
  augmentation_probability: 0.5

training:
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: adam
  scheduler: reduce_on_plateau
  early_stopping_patience: 15

output:
  checkpoint_dir: checkpoints
  log_dir: logs
  save_best_only: true
